<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter+Tight:wght@500;600;700&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}html,body{width:1200px;height:900px;overflow:hidden}
body{background:#15130F;color:#F5F1EA;font-family:'Inter Tight',sans-serif;position:relative}
.photo{position:absolute;right:0;top:0;width:520px;height:900px;background:url(/assets/safwan-portrait.jpg) center/cover}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#15130F 0%,rgba(21,19,15,.55) 30%,rgba(21,19,15,0) 65%)}
.txt{position:absolute;left:72px;top:72px;bottom:72px;width:600px;display:flex;flex-direction:column;justify-content:space-between;z-index:2}
.eye{font-size:24px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#FF5A1F;display:flex;align-items:center;gap:14px}
.eye:before{content:"";width:14px;height:14px;border-radius:50%;background:#FF5A1F}
h1{font-size:{{SIZE_74_TO_84}}px;line-height:1.02;letter-spacing:-.045em;font-weight:700}
h1 em{font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;color:#FF5A1F;letter-spacing:-.02em}
.brand{font-size:30px;font-weight:700;letter-spacing:-.03em}.brand span{color:#FF5A1F}
.brand small{display:block;font-size:20px;font-weight:500;color:#A9A398;letter-spacing:0;margin-top:6px}
</style></head><body><div class="photo"></div><div class="txt">
<div class="eye">{{CATEGORY}}</div><h1>{{SHORT_TITLE_WITH_ONE_EM}}</h1>
<div class="brand">Safwan<span>.</span><small>safwandigital.com</small></div></div></body></html>
